name: Release

# Builds a signed APK and AAB for a version tag (e.g. v2.0.0) and publishes them as a GitHub release.
# To re-run for an existing tag, use "Run workflow" and pick the tag under "Use workflow from".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check that a tag is being released
        if: github.ref_type != 'tag'
        run: |
          echo "::error title=Not a tag::Releases are built from version tags. Push a tag such as v2.0.0, or choose the tag under 'Use workflow from' when running this workflow manually."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDTRACKER_KEYSTORE_BASE64 }}
          SPENDTRACKER_KEYSTORE_PASSWORD: ${{ secrets.SPENDTRACKER_KEYSTORE_PASSWORD }}
          SPENDTRACKER_KEY_ALIAS: ${{ secrets.SPENDTRACKER_KEY_ALIAS }}
          SPENDTRACKER_KEY_PASSWORD: ${{ secrets.SPENDTRACKER_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 SPENDTRACKER_KEYSTORE_PASSWORD SPENDTRACKER_KEY_ALIAS SPENDTRACKER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              secret="$name"
              [ "$name" = KEYSTORE_BASE64 ] && secret=SPENDTRACKER_KEYSTORE_BASE64
              missing="$missing $secret"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing signing secrets::Add these repository secrets (Settings > Secrets and variables > Actions):$missing. See the Publishing section of README.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/spendtracker-upload.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" || [ ! -s "$keystore" ]; then
            echo "::error title=Invalid keystore secret::SPENDTRACKER_KEYSTORE_BASE64 is not a valid base64-encoded keystore."
            exit 1
          fi
          echo "SPENDTRACKER_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Test and build signed release
        env:
          SPENDTRACKER_KEYSTORE_PASSWORD: ${{ secrets.SPENDTRACKER_KEYSTORE_PASSWORD }}
          SPENDTRACKER_KEY_ALIAS: ${{ secrets.SPENDTRACKER_KEY_ALIAS }}
          SPENDTRACKER_KEY_PASSWORD: ${{ secrets.SPENDTRACKER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$apk" ]; then
            echo "::error title=Unsigned build::$apk was not produced; the release build was not signed."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/SpendTracker-$TAG.apk"
          cp "$aab" "dist/SpendTracker-$TAG.aab"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" "dist/SpendTracker-$TAG.apk" "dist/SpendTracker-$TAG.aab" \
            --title "SpendTracker $TAG" --generate-notes --verify-tag $prerelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/spendtracker-upload.jks"
